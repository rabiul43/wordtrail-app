<section id="ow-card" class="ow-card" role="dialog" aria-modal="false" aria-labelledby="ow-title" hidden>
  <button id="ow-grip" class="ow-grip" type="button" aria-label="Close"></button>
  <div class="ow-tags" id="ow-tags"></div>
  <h2 id="ow-title" class="ow-title" tabindex="-1"></h2>
  <div class="wp-card ow-box">
    <h3 class="wp-label">It means</h3>
    <p class="wp-big" id="ow-mean"></p>
    <p class="ow-note" id="ow-note" hidden></p>
  </div>
  <div class="wp-card ow-box" id="ow-tr" hidden>
    <p class="wp-big ow-trtext" id="ow-trtext"></p>

  </div>
  <div class="ow-more" id="ow-more" hidden>
    <h3 class="wp-label">Other old words in this chapter</h3>
    <div class="ow-chips" id="ow-chips"></div>
  </div>
  <button id="ow-save" data-lrn class="wl-btn wl-btn--primary wl-btn--block ow-save" type="button" aria-pressed="false"></button>
</section>
