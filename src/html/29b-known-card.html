<section id="kw-card" data-lrn class="ow-card kw-card" role="dialog" aria-modal="false" aria-labelledby="kw-title" hidden>
  <button id="kw-grip" class="ow-grip" type="button" aria-label="Close"></button>
  <div class="kw-head">
    <div class="kw-text">
      <h2 id="kw-title" class="ow-title" tabindex="-1"></h2>
      <p id="kw-mean" class="kw-mean" aria-live="polite"></p>
    </div>
    <button id="kw-say" class="kw-say" type="button" aria-label="Hear a word"><span aria-hidden="true">&#128266;</span></button>
  </div>
  <div class="kw-acts">
    <button id="kw-know" class="wl-btn wl-btn--ok" type="button">I know it</button>
    <button id="kw-learn" class="wl-btn wl-btn--primary" type="button" aria-pressed="false"><span aria-hidden="true">&#9733;</span><span id="kw-learn-t">Learn</span></button>
  </div>
</section>
